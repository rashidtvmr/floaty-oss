name: Linux portable release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  package-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y musl-tools file python3-gi gir1.2-gtk-3.0 xvfb xauth
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: GTK desktop smoke under virtual X11
        run: |
          set +e
          timeout 4s xvfb-run -a /usr/bin/python3 apps/context-desktop/ui/linux-gtk.py >/tmp/contextlens-gtk.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            cat /tmp/contextlens-gtk.log
            echo "GTK window exited too early ($code)"
            exit 1
          fi
      - name: Release binary
        run: cargo build --locked --release -p context-cli --target x86_64-unknown-linux-musl
      - name: Download offline transcription model
        run: ./scripts/setup-whisper-model.sh
      - name: Assemble portable Linux archive
        run: ./scripts/build-linux-release.sh x86_64
      - name: Verify archive contents and checksum
        run: |
          cd dist
          sha256sum -c contextlens-linux-x86_64-*.sha256
          tar tzf contextlens-linux-x86_64-*.tar.gz | grep '/bin/context-cli$'
          tar tzf contextlens-linux-x86_64-*.tar.gz | grep '/linux-portal-capture.py$'
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextlens-linux-x86_64
          path: |
            dist/contextlens-linux-x86_64-*.tar.gz
            dist/contextlens-linux-x86_64-*.tar.gz.sha256
          retention-days: 30
