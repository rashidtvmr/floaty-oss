[package]
name = "socket_stream_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Authentication transport is not wired into the desktop application yet.
codex-auth-experimental = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# Direct POSIX flock/O_NOFOLLOW wrappers for config persistence. Already in
# Cargo.lock via the CLI, so this adds no new crate; it keeps the workspace MSRV
# at 1.88 instead of requiring File::lock (stabilized in 1.89).
libc = "0.2"
