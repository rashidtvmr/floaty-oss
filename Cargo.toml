[workspace]
resolver = "2"
members = ["crates/socket_stream_core", "apps/socket_stream"]
exclude = ["apps/socket_stream_desktop"]
default-members = ["crates/socket_stream_core", "apps/socket_stream"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
tempfile = "3"
